<svg xmlns="http://www.w3.org/2000/svg" width="4096" height="2304" viewBox="0 0 4096 2304" role="img" aria-labelledby="title desc">
  <title id="title">Seori Labs Google Play developer profile header</title>
  <desc id="desc">A dark Seori Labs brand header for Google Play developer profile pages, featuring the logo, product development, automation, and AI systems.</desc>
  <defs>
