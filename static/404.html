<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>페이지를 찾을 수 없습니다 - Seori Labs</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<style>
			:root {
				--ink: #112128;
				--surface: #f6f8f8;
				--accent: #0f6f8a;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100svh;
				display: grid;
				place-content: center;
				gap: 20px;
				padding: 40px 20px;
				background: var(--surface);
				color: #182126;
				font-family:
					Inter, Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', ui-sans-serif, system-ui,
					sans-serif;
				text-align: center;
			}
			.mark {
				width: 40px;
				height: 40px;
				margin: 0 auto;
			}
			h1 {
				margin: 0;
				font-size: 1.8rem;
				line-height: 1.3;
				word-break: keep-all;
			}
			p {
				margin: 0;
				max-width: 44ch;
				color: rgba(19, 32, 39, 0.7);
				line-height: 1.75;
				word-break: keep-all;
			}
			.links {
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 10px;
			}
			a {
				display: inline-flex;
				align-items: center;
				min-height: 44px;
				padding: 0 18px;
				border: 1px solid rgba(19, 32, 39, 0.16);
				border-radius: 8px;
				background: #fff;
				color: var(--ink);
				font-weight: 700;
				text-decoration: none;
			}
			a.primary {
				border-color: var(--ink);
				background: var(--ink);
				color: #fff;
			}
			a:hover {
				border-color: var(--accent);
				color: var(--accent);
			}
			a.primary:hover {
				background: var(--accent);
				border-color: var(--accent);
				color: #fff;
			}
		</style>
	</head>
	<body>
		<img class="mark" src="/brand/seori-labs-mark.svg" alt="Seori Labs" width="40" height="40" />
		<h1>페이지를 찾을 수 없습니다</h1>
		<p>
			주소가 바뀌었거나 삭제된 페이지입니다. 앱 목록이나 법적 고지에서 찾으시는 문서를 확인해
			보세요.
		</p>
		<div class="links">
			<a class="primary" href="/">홈으로</a>
			<a href="/apps/">앱 목록</a>
			<a href="/legal/">법적 고지</a>
		</div>
	</body>
</html>
