apiVersion: apps/v1
kind: Deployment
metadata:
  name: seorilabs-official
  namespace: apps
  labels:
    app: seorilabs-official
    app.kubernetes.io/name: seorilabs-official
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seorilabs-official
  template:
    metadata:
      labels:
        app: seorilabs-official
        app.kubernetes.io/name: seorilabs-official
        app.kubernetes.io/component: web
    spec:
      imagePullSecrets:
        - name: registry-pull-cred
      nodeSelector:
        kubernetes.io/hostname: rpi4001
      containers:
        - name: seorilabs-official
          image: nginx:1.27-alpine
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
